# Upper and work directories for the overlayfs mounts generated by the
# overlayfs.bbclass. /data is mounted from the persistent data partition
# before systemd-tmpfiles runs.
d /data/upper          0755 root root -
d /data/upper/home     0755 root root -
d /data/upper/root     0755 root root -
d /data/upper/srv      0755 root root -
d /data/workdir        0755 root root -
d /data/workdir/home   0755 root root -
d /data/workdir/root   0755 root root -
d /data/workdir/srv    0755 root root -
